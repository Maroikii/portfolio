<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>My Portfolio</h1>
      <p>Welcome to my personal website with my drawings and coding languages.</p>
    </header>

    <main>
      <section aria-labelledby="drawings-title">
        <h2 id="drawings-title">My Drawings</h2>
        <div class="card-grid">
          <article class="card">
            <h3>Sketch 01</h3>
            <p>Character concept drawing.</p>
          </article>
          <article class="card">
            <h3>Sketch 02</h3>
            <p>Landscape pencil study.</p>
          </article>
          <article class="card">
            <h3>Sketch 03</h3>
            <p>Ink line-art practice.</p>
          </article>
        </div>
      </section>

      <section aria-labelledby="languages-title">
        <h2 id="languages-title">Coding languages I know</h2>
        <ul class="language-list">
          <li>Python</li>
          <li>HTML</li>
          <li>CSS</li>
        </ul>
      </section>
    </main>
  </body>
</html>
